name: Probe reusable CI

# Throwaway probe for UAMS-Web/uams-claude-skills#485. Not part of the template; the branch is
# never merged. Calls the reusable chain once with the legs off and two jobs kept on all three,
# and reports a caller `CI` job that needs the called jobs.

on:
  push:
    branches: [485-probe-reusable-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@485-ci-workflow
    with:
      linux-only: true
      all-platform-jobs: 'pint pest'

  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every called job succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = "success" ]
