name: CI

# PROBE ONLY (UAMS-Web/uams-ci-workflows#2, test plan item 1). This branch is never merged. It
# replaces this repository's own chain with a call of the reusable workflow at its default inputs,
# and keeps the caller `CI` job that `needs:` the call, which is the shape a repository adopts.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@485-ci-workflow

  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every called job succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          [ "$RESULT" = "success" ]
