name: CI

# The jobs mirror the scripts `composer ci` runs locally, but run in parallel, so every failure
# on a pull request shows at once instead of one job at a time. `composer ci` keeps its cost
# order, so a local run still stops at the first failure. When a job's command changes here,
# change the matching `composer` script (and the other way round). The shared setup lives in
# `.github/actions/setup/action.yml`.
#
# RUN_REMOTE_CI: budget kill-switch.
# GitHub Actions minutes bill at the organization level, one pool shared by every UAMS-Web
# repository, and only private repositories consume them. Every job below, and every job in
# the pull-request workflows beside this one, is gated on `if: vars.RUN_REMOTE_CI != 'false'`:
# with the variable set to `false` the jobs report `skipped` and consume no runner minutes;
# unset, or any other value, runs them as before. A skipped job reports `Success`, so a green
# required check while the switch is off means nothing ran, not that the code passed;
# `composer ci` is the gate then. This template repository is private, so the switch is off
# here; the add-ons generated from it are public, where minutes are free and nobody sets the
# variable, so the gate does nothing there. `scripts/remote-ci-gate.test.mjs` fails when a job
# is added without it.
#
# REQUIRED CHECKS. The organization ruleset "main: required checks
# (<this repository>)" requires every job's `name:` below, plus the `name:` of the two
# pull-request-body workflows, by that exact string. Renaming or adding a job here means
# updating that ruleset's list in the same change: a renamed job leaves the old name pending
# forever and blocks every pull request, and a new job is not required until it is listed.
# Job names must stay unique across all workflows in this repository.
# `check-required-checks.yml` compares the two lists and reports drift; see its header for the
# order in which a job and its ruleset entry change.
#
# THE `CI` AGGREGATE. The last job, `ci` (named `CI`), `needs:` every other job in this file and
# fails unless each one succeeded, so a ruleset can require the one name `CI` instead of every
# job's (UAMS-Web/uams-claude-skills#471). Adding, renaming or removing a job here means changing
# the `CI` job's `needs:` list in the same change: a job left out of it is required by nothing.
# The `aggregate-needs` job runs `check-aggregate-needs.mjs`, which fails, naming the job, when
# the list and the jobs drift apart. A job can only `needs:` jobs in its own workflow, so the
# aggregate lives here and not in the synced `synced-checks.yml`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all


  no-emoji:
    name: Repository guards (emoji, decision log)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file and code points, when an emoji reaches a tracked record.
      - run: node scripts/check-no-emoji.mjs

      # Fails, naming the two entries, when docs/DECISIONS.md is out of order.
      - run: node scripts/check-decision-log-order.mjs

  aggregate-needs:
    name: Aggregate needs
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  scripts:
    name: Guard-script tests (vitest)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `@statamic/cms` is a `file:` link into `vendor/statamic/cms`, so `npm ci` needs Composer's
      # install first.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22 bundles npm 10.9.x, below the `engines.npm` floor that `.npmrc`'s
      # engine-strict enforces, so `npm ci` refuses to run without this pin.
      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci
      - run: npm run test:scripts

  built-assets:
    name: Built assets (resources/dist matches source)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pin npm to the engines floor
        run: npm install -g npm@^11.10.0

      - run: npm ci

      # The built files are committed, because a Composer install does not run npm. A fresh
      # build that differs from what is committed means the sources changed without a rebuild.
      - run: npm run build
      - name: Fail if the committed build is out of date
        run: |
          changes=$(git status --porcelain -- resources/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::resources/dist differs from a fresh build. Run npm run build and commit the result."
            exit 1
          fi

  mutate-ignore:
    name: Mutation annotations (none inert)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:mutate-ignore


  parallel-safe:
    name: Parallel-safe tests (no shared state)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Dependency-free, so it needs PHP and nothing else.
      - run: composer test:parallel-safe

  pint:
    name: Pint
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector (gating profile)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: Larastan (PHPStan)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer stan

  pest:
    name: Pest (Unit and Integration)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # --log-junit feeds the band checks below; it changes nothing about what runs.
      - name: Run the suite
        run: composer test -- --display-all-issues --log-junit junit-parallel.xml

      # Fails when more tests skipped than tests/skip-baseline.json records (a silent skip
      # must not read as a pass), or when one class's cost nears the band's.
      - name: Check the band reports
        run: composer test:bands

  # The mutation score on a pull request's changed classes. It installs PCOV through the setup
  # action's `coverage` input, because `--mutate` without a coverage driver either errors or
  # reports `0 Mutations for 0 Files created`, and it fails on a run that created no mutants as
  # well as on any untested, uncovered or timed-out mutant. On a pull request it mutates only the
  # PHP files the pull request adds, changes or renames under MUTATE_PATHS (the paths
  # `composer mutate` passes to `--path`), and passes with the reason printed when there are
  # none. A push mutates nothing here, because the template's `src/` has no code yet (the
  # "Select the files to mutate" step says what an add-on changes once it has).
  mutate:
    name: Mutation score (changed files, with PCOV)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 45
    # An explicit `bash` runs each step with `-eo pipefail`; the default, `bash -e`, does not,
    # and the run step's `| tee` would then report tee's status in place of Pest's.
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2: on a pull request the checkout is GitHub's merge commit, and its first parent
      # is the base branch it was merged onto.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          coverage: pcov

      # The files are read from the merge commit against its first parent, so a later change on
      # the base branch is not counted. Set MUTATE_PATHS to the paths `composer mutate` passes to
      # `--path`, space-separated.
      - name: Select the files to mutate
        id: select
        env:
          EVENT: ${{ github.event_name }}
          MUTATE_PATHS: src
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            # TEMPLATE ONLY. The stub in `src/` holds no code a mutator changes, so a full run
            # creates no mutants and fails by design. An add-on whose `src/` has code replaces
            # this block with `echo "mode=full" >> "$GITHUB_OUTPUT"` so a push mutates
            # everything `composer mutate` covers (the README's step 2 repeats this).
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the template's src/ has no code to mutate, so a push runs nothing."
            exit 0
          fi
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::HEAD is not a merge commit, so the pull request's changes cannot be read."
            exit 1
          fi
          # NUL-separated, so a name git would quote (non-ASCII, a tab) is read as it is
          list=$(mktemp)
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- $MUTATE_PATHS > "$list"
          files=()
          while IFS= read -r -d '' f; do
            [[ "$f" == *.php ]] || continue
            if [[ "$f" == *,* || "$f" == *$'\n'* ]]; then
              echo "::error::A changed path holds a comma or a newline, which --path cannot carry: $f"
              exit 1
            fi
            files+=("$f")
          done < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No PHP file under $MUTATE_PATHS is added or changed by this pull request, so there is nothing to mutate."
            exit 0
          fi
          echo "Mutating ${#files[@]} changed file(s):"
          printf '%s\n' "${files[@]}"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "paths=$(IFS=,; echo "${files[*]}")" >> "$GITHUB_OUTPUT"

      # `--min=100` makes Pest fail the step on any survivor. The run is kept in a log because a
      # run that mutated nothing is a setup failure that Pest's exit status reports or not
      # depending on its version and `ignore_min_score_on_zero_mutations`. A later `--path`
      # replaces the one `composer mutate` passes. On changed files, zero mutants is left to the
      # check step, so Pest is told not to fail it.
      - name: Run mutation testing
        if: steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          if [ "$MODE" = "changed" ]; then
            composer mutate -- --min=100 --ignore-min-score-on-zero-mutations --path="$PATHS" 2>&1 | tee mutate.log
          else
            composer mutate -- --min=100 2>&1 | tee mutate.log
          fi

      # Reads the log, not the exit status: fails on zero mutants, and on any untested, uncovered,
      # pending or timed-out mutant. Runs even when the step above failed, so the log's own
      # account of the failure is printed; skipped only when nothing was selected. One exception:
      # changed files that exist, mutated with PCOV loaded, that produce zero mutants hold no code
      # a mutator changes (an interface, say), which is a pass. Zero mutants on a full run, or
      # with no PCOV, still fails.
      - name: Check the mutation run
        if: always() && steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          if [ "$MODE" = "changed" ] && sed "s/$(printf '\033')\[[0-9;]*m//g" mutate.log | grep -Eq '(^|[^0-9])0 Mutations for 0 Files created' \
            && php -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'; then
            echo "The changed files produced no mutants: they hold no code a mutator changes, so there is nothing to test."
            exit 0
          fi
          php .claude/skills/pest-testing/scripts/check-mutation-run.php mutate.log

  # The add-on promises `statamic/cms` at its `composer.json` constraint and PHP ^8.4, and every
  # job above runs one combination. These legs run the dependency-sensitive checks (Larastan and
  # Pest) against the others:
  #   - lowest: the lowest `statamic/cms` the constraint allows, with the dependencies it needs
  #     pulled to their lowest, so an API newer than the declared floor fails here.
  #   - php85: the locked dependencies on PHP 8.5.
  # The lowest bound is derived from the constraint in `composer.json`, never written here, so
  # raising the floor (when code starts to need a newer `statamic/cms` API) moves this leg with it.
  # Check names carry no version number for the same reason: the ruleset's list stays stable.
  # Only the `statamic/cms` dependency closure is lowered; the dev tooling stays locked. The
  # update rewrites `composer.lock` in the runner only.
  # Two jobs rather than one matrix job: a job skipped by the RUN_REMOTE_CI gate is skipped before
  # a matrix expands, so it would report the literal name `Compatibility (${{ matrix.name }})` and
  # the two required checks below would never report. Each job's `name:` is a required check.
  compatibility-lowest:
    name: Compatibility (lowest statamic/cms)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.4'

      - name: Lower statamic/cms and its dependencies to their lowest allowed versions
        run: composer update statamic/cms --prefer-lowest --with-all-dependencies --no-interaction --no-progress

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  compatibility-php85:
    name: Compatibility (PHP 8.5)
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      - name: Show the resolved statamic/cms
        run: composer show statamic/cms | grep -E '^(name|versions)'

      - run: composer stan
      - run: composer test

  # The aggregate a ruleset requires; see THE `CI` AGGREGATE in the header. `always()` runs it
  # when a needed job failed, so it reports a failure rather than staying pending. It also carries
  # the RUN_REMOTE_CI gate: with the switch off every needed job is skipped, and this job would
  # otherwise fail on those skips and block every merge, where the switch means "nothing ran".
  ci:
    name: CI
    needs: [composer-validate, no-emoji, aggregate-needs, scripts, built-assets, mutate-ignore, parallel-safe, pint, rector, phpstan, pest, mutate, compatibility-lowest, compatibility-php85]
    if: always() && vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
